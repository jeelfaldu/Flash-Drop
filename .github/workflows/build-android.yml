name: Build Android (APK & AAB)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build Release APK'
        required: true
        type: boolean
        default: true
      build_aab:
        description: 'Build Release AAB (Play Store)'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Get version from package.json
        id: pkg_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Release APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_apk }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Build Release AAB (App Bundle)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_aab }}
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Upload Release APK Artifact
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: FlashDrop-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload Release AAB Artifact
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_aab }}
        uses: actions/upload-artifact@v4
        with:
          name: FlashDrop-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg_version.outputs.version }}-b${{ github.run_number }}
          name: FlashDrop v${{ steps.pkg_version.outputs.version }} (Build #${{ github.run_number }})
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
